<!DOCTYPE html>
<html lang="en" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AFRRCS Site Assessment</title>
<style>
  :root{
    --navy:#0F3D3D;
    --blue:#1B6E6A;
    --blue-mid:#2E938C;
    --blue-light:#E4F3F1;
    --bg:#F4F7F6;
    --surface:#FFFFFF;
    --text:#1B2733;
    --muted:#5B6B7A;
    --border:#D8E3E1;
    --good:#2E7D32;
    --warn:#B45309;
    --bad:#B3261E;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;display:flex;flex-direction:column;}
  #app{max-width:520px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;min-height:100vh;}

  header.topbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
    position:sticky;top:0;z-index:20;}
  header.topbar .checklist-icon{display:flex;align-items:center;color:#6FCFC7;flex-shrink:0;}
  header.topbar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.2px;flex:1;}
  header.topbar .back{background:none;border:none;color:#fff;font-size:20px;padding:4px 8px;cursor:pointer;}

  main{flex:1;padding:16px 16px 100px;overflow-y:auto;}
  .hidden{display:none !important;}

  /* ---- Home screen ---- */
  .home-hero{background:linear-gradient(135deg,var(--blue) 0%,var(--navy) 100%);color:#fff;border-radius:var(--radius);
    padding:20px;margin-bottom:18px;}
  .home-hero h2{margin:0 0 6px;font-size:20px;}
  .home-hero p{margin:0;font-size:13px;color:#CBEAE5;line-height:1.4;}
  .btn{display:block;width:100%;border:none;border-radius:10px;padding:15px 16px;font-size:16px;font-weight:600;
    cursor:pointer;text-align:center;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:active{background:var(--navy);}
  .btn-secondary{background:var(--surface);color:var(--blue);border:1.5px solid var(--blue);}
  .btn-ghost{background:none;color:var(--muted);border:1px solid var(--border);}
  .btn-danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad);}
  .btn-row{display:flex;gap:8px;}
  .btn-row .btn{flex:1;}

  .section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    margin:22px 0 8px;}
  .draft-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .draft-card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .draft-card .site{font-weight:700;font-size:15px;}
  .draft-card .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge-draft{background:#FFF1CC;color:#8A5A00;}
  .badge-done{background:#DFF3E1;color:var(--good);}
  .draft-card .actions{margin-top:10px;display:flex;gap:8px;}
  .draft-card .actions button{flex:1;font-size:13px;padding:9px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);cursor:pointer;}
  .empty-note{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px;}

  /* ---- Wizard ---- */
  .progress-wrap{padding:10px 16px 0;background:var(--navy);}
  .progress-bars{display:flex;gap:3px;padding-bottom:10px;}
  .progress-bars .seg{flex:1;height:5px;border-radius:3px;background:#1E5654;}
  .progress-bars .seg.done{background:#6FCFC7;}
  .progress-bars .seg.current{background:#fff;}
  .progress-label{color:#BFE8E2;font-size:11px;padding-bottom:8px;}

  .card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--border);}
  .card h2{font-size:16px;margin:0 0 4px;}
  .card .sub{font-size:12px;color:var(--muted);margin-bottom:14px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
  .field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
  input[type=text],input[type=number],input[type=date],textarea{
    width:100%;border:1.5px solid var(--border);border-radius:8px;padding:12px;font-size:15px;
    font-family:inherit;background:#fff;color:var(--text);}
  textarea{min-height:80px;resize:vertical;}
  input:focus,textarea:focus{outline:2px solid var(--blue-mid);border-color:var(--blue-mid);}

  .choice-group{display:flex;flex-wrap:wrap;gap:8px;}
  .choice-btn{flex:1 1 auto;min-width:80px;padding:11px 10px;border-radius:8px;border:1.5px solid var(--border);
    background:#fff;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;text-align:center;}
  .choice-btn.sel{background:var(--blue);border-color:var(--blue);color:#fff;}
  .choice-btn.sel.yes{background:var(--good);border-color:var(--good);}
  .choice-btn.sel.no{background:var(--bad);border-color:var(--bad);}

  .site-search input{margin-bottom:6px;}
  .site-results{max-height:220px;overflow-y:auto;border:1.5px solid var(--border);border-radius:8px;}
  .site-result{padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;}
  .site-result:last-child{border-bottom:none;}
  .site-result:active{background:var(--blue-light);}
  .site-selected{display:flex;align-items:center;justify-content:space-between;background:var(--blue-light);
    border:1.5px solid var(--blue-mid);border-radius:8px;padding:12px;}
  .site-selected .name{font-weight:700;color:var(--blue);}
  .site-selected button{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;}

  .gps-row{display:flex;gap:8px;margin-bottom:8px;}
  .gps-row input{flex:1;}
  .gps-btn{background:var(--blue-light);border:1.5px solid var(--blue-mid);color:var(--blue);border-radius:8px;
    padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .gps-status{font-size:12px;color:var(--muted);min-height:16px;}



  .review-group{margin-bottom:14px;}
  .review-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 6px;}
  .review-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border);}
  .review-row .k{color:var(--muted);}
  .review-row .v{font-weight:600;text-align:right;}

  footer.navbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20;}
  footer.navbar .wrap{max-width:520px;margin:0 auto;display:flex;gap:10px;}
  footer.navbar button{flex:1;padding:14px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer;}
  footer.navbar .nav-back{background:var(--bg);color:var(--text);border:1px solid var(--border);}
  footer.navbar .nav-next{background:var(--blue);color:#fff;}
  footer.navbar .nav-finish{background:var(--good);color:#fff;}

  .toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2);}

  .done-wrap{text-align:center;padding:40px 20px;}
  .done-wrap .check{width:64px;height:64px;border-radius:50%;background:var(--good);color:#fff;font-size:32px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .done-wrap h2{margin:0 0 8px;}
  .done-wrap p{color:var(--muted);font-size:14px;margin-bottom:24px;}
</style>

/* ============================================================
   Storage: IndexedDB, with an in-memory fallback if it's unavailable
   (some mobile browsers restrict IndexedDB for files opened directly,
   e.g. file:// pages -- rather than fail silently, this app still works
   in that case, it just won't remember drafts between app restarts).
   ============================================================ */
let db;
let usingMemoryFallback = false;
let memoryStore = [];

function openDB(){
  return new Promise((resolve)=>{
    if(typeof indexedDB === "undefined"){
      usingMemoryFallback = true;
      resolve(null);
      return;
    }
    try{
      const req = indexedDB.open("afrrcs_assessments", 1);
      req.onupgradeneeded = e=>{
        const d = e.target.result;
        if(!d.objectStoreNames.contains("drafts")){
          d.createObjectStore("drafts",{keyPath:"id"});
        }
      };
      req.onsuccess = e=>{ db = e.target.result; resolve(db); };
      req.onerror = ()=>{ usingMemoryFallback = true; resolve(null); };
    }catch(err){
      usingMemoryFallback = true;
      resolve(null);
    }
  });
}
function dbPut(record){
  if(usingMemoryFallback){
    memoryStore = memoryStore.filter(r=>r.id !== record.id);
    memoryStore.push(JSON.parse(JSON.stringify(record)));
    return Promise.resolve();
  }
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("drafts","readwrite");
    tx.objectStore("drafts").put(record);
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e);
  });
}
function dbDelete(id){
  if(usingMemoryFallback){
    memoryStore = memoryStore.filter(r=>r.id !== id);
    return Promise.resolve();
  }
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("drafts","readwrite");
    tx.objectStore("drafts").delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e);
  });
}
function dbGetAll(){
  if(usingMemoryFallback){
    return Promise.resolve(memoryStore.slice());
  }
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("drafts","readonly");
    const req = tx.objectStore("drafts").getAll();
    req.onsuccess=()=>resolve(req.result || []);
    req.onerror=e=>reject(e);
  });
}

   App state
   ============================================================ */
let current = null;     // the in-progress draft record
let stepIndex = 0;
let saveTimer = null;

function uuid(){
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c=="x"?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

function newDraft(){
  return {
    id: uuid(),
    status: "draft",
    updatedAt: Date.now(),
    data: { "Assessment Date": todayISO() },
  };
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    current.updatedAt = Date.now();
    dbPut(current);
  }, 400);
}

/* ============================================================
   Rendering: HOME screen
   ============================================================ */
const main = document.getElementById("main");
const topTitle = document.getElementById("topTitle");
const btnBack = document.getElementById("btnBack");
const progressWrap = document.getElementById("progressWrap");
const navbar = document.getElementById("navbar");

function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}

async function renderHome(){
  topTitle.textContent = "AFRRCS Site Assessments";
  btnBack.classList.add("hidden");
  progressWrap.classList.add("hidden");
  navbar.classList.add("hidden");

  const drafts = (await dbGetAll()).sort((a,b)=>b.updatedAt-a.updatedAt);

  const fallbackWarning = usingMemoryFallback ? `
    <div class="fallback-warning" style="background:#FFF1CC;border:1px solid #E0B000;border-radius:10px;padding:12px 14px;margin-bottom:10px;">
      <div style="font-weight:700;font-size:13px;">This device/browser is blocking this app's normal storage.</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px;">You can still fill out and send assessments, but anything in progress will be lost if you close this app or your browser -- finish and send each assessment in one sitting to be safe.</div>
    </div>` : "";

  let html = `
    <div class="home-hero">
      <h2>Field Security Checklist</h2>
      <p>Works fully offline. Fill out a checklist at any site, then send the saved file back to the office to add it to the master log.</p>
    </div>
    ${fallbackWarning}
    <button class="btn btn-primary" id="btnNew">+ New Assessment</button>
    <div class="section-label">Saved on this device</div>
  `;

  if(drafts.length === 0){
    html += `<div class="empty-note">Nothing saved yet. Start a new assessment above.</div>`;
  } else {
    for(const d of drafts){
      const site = d.data["Site Name"] || "(no site chosen yet)";
      const badge = d.status === "completed"
        ? `<span class="badge badge-done">Sent</span>`
        : `<span class="badge badge-draft">In progress</span>`;
      html += `
        <div class="draft-card" data-id="${d.id}">
          <div class="row">
            <div>
              <div class="site">${escapeHtml(site)}</div>
              <div class="meta">${d.data["Assessment Date"] || ""} &middot; updated ${fmtDate(d.updatedAt)}</div>
            </div>
            ${badge}
          </div>
          <div class="actions">
            <button class="act-open">${d.status==="completed" ? "View / Re-send" : "Continue"}</button>
            <button class="act-delete">Delete</button>
          </div>
        </div>`;
    }
  }
  main.innerHTML = html;

  document.getElementById("btnNew").onclick = ()=>{
    current = newDraft();
    stepIndex = 0;
    dbPut(current).then(renderStep);
  };
  main.querySelectorAll(".draft-card").forEach(card=>{
    const id = card.dataset.id;
    const draft = drafts.find(x=>x.id===id);
    card.querySelector(".act-open").onclick = ()=>{
      current = draft;
      stepIndex = draft.status === "completed" ? STEPS.length-1 : 0;
      renderStep();
    };
    card.querySelector(".act-delete").onclick = async ()=>{
      if(confirm(`Delete the assessment for "${draft.data["Site Name"]||"this site"}"? This can't be undone.`)){
        await dbDelete(id);
        renderHome();
      }
    };
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   Rendering: WIZARD steps
   ============================================================ */
function renderProgress(){
  progressWrap.classList.remove("hidden");
  const bars = document.getElementById("progressBars");
  bars.innerHTML = STEPS.map((s,i)=>{
    let cls = "seg";
    if(i < stepIndex) cls += " done";
    if(i === stepIndex) cls += " current";
    return `<div class="${cls}"></div>`;
  }).join("");
  document.getElementById("progressLabel").textContent =
    `Step ${stepIndex+1} of ${STEPS.length} — ${STEPS[stepIndex].title}`;
}

function fieldValue(key){
  return current.data[key] !== undefined ? current.data[key] : "";
}
function setFieldValue(key, val){
  current.data[key] = val;
  scheduleSave();
}

// When a site is chosen, pull in whatever we already know about it (from the
// AFRRCS towers register) so the field crew doesn't have to retype it --
// same idea as the site auto-fill in the Incident Report app.
function applySiteDefaults(siteName){
  const site = SITES.find(s=>s.name === siteName);
  if(!site) return;
  if(site.lat !== undefined) setFieldValue("Latitude", site.lat.toFixed(6));
  if(site.lon !== undefined) setFieldValue("Longitude", site.lon.toFixed(6));
  if(site.legal) setFieldValue("Legal Land Description", site.legal);
}

function renderStep(){
  topTitle.textContent = current.data["Site Name"] || "New Assessment";
  btnBack.classList.remove("hidden");
  renderProgress();
  navbar.classList.remove("hidden");

  const step = STEPS[stepIndex];
  const isReview = step.title === "Review & Finish";

  let html = `<div class="card"><h2>${step.title}</h2>`;
  if(isReview){
    html += renderReview();
  } else {
    for(const f of step.fields){
      html += renderField(f);
    }
  }
  html += `</div>`;
  main.innerHTML = html;
  wireFieldEvents(step);

  const navBackBtn = document.getElementById("navBackBtn");
  const navNextBtn = document.getElementById("navNextBtn");
  navBackBtn.textContent = "Back";
  navBackBtn.disabled = false;
  navBackBtn.onclick = ()=>{
    if(stepIndex === 0){ current=null; renderHome(); }
    else { stepIndex--; renderStep(); }
  };
  btnBack.onclick = navBackBtn.onclick;

  if(isReview){
    navNextBtn.textContent = "Save & Send File";
    navNextBtn.className = "nav-finish";
    navNextBtn.onclick = finishAssessment;
  } else {
    navNextBtn.textContent = stepIndex === STEPS.length-2 ? "Review" : "Next";
    navNextBtn.className = "nav-next";
    navNextBtn.onclick = ()=>{
      if(stepIndex === 0 && !current.data["Site Name"]){
        toast("Please choose a site before continuing.");
        return;
      }
      stepIndex++; renderStep();
    };
  }
}

function renderField(f){
  const val = fieldValue(f.key);
  switch(f.type){
    case "site": return renderSiteField(f);
    case "gps": return renderGpsField();
    case "text": {
      let hint = "";
      if(f.key === "Legal Land Description"){
        const site = SITES.find(s=>s.name === current.data["Site Name"]);
        if(site && site.legal) hint = `<div class="hint">Auto-filled from the site register &mdash; edit if this visit found it different.</div>`;
      }
      return `
      <div class="field"><label>${f.label}</label>
        <input type="text" data-key="${f.key}" value="${escapeHtml(val)}">${hint}</div>`;
    }
    case "textarea": return `
      <div class="field"><label>${f.label}</label>
        <textarea data-key="${f.key}">${escapeHtml(val)}</textarea></div>`;
    case "number": return `
      <div class="field"><label>${f.label}</label>
        <input type="number" inputmode="decimal" data-key="${f.key}" value="${escapeHtml(val)}"></div>`;
    case "date": return `
      <div class="field"><label>${f.label}</label>
        <input type="date" data-key="${f.key}" value="${escapeHtml(val)}"></div>`;
    case "choice": return `
      <div class="field"><label>${f.label}</label>
        <div class="choice-group" data-key="${f.key}">
          ${f.options.map(o=>{
            let extra = "";
            if(o==="Yes") extra=" yes"; if(o==="No") extra=" no";
            return `<button type="button" class="choice-btn${val===o?" sel"+extra:""}" data-val="${escapeHtml(o)}">${o}</button>`;
          }).join("")}
        </div></div>`;
    default: return "";
  }
}

function renderSiteField(f){
  const chosen = current.data["Site Name"];
  if(chosen){
    return `
      <div class="field">
        <label>${f.label}</label>
        <div class="site-selected">
          <span class="name">${escapeHtml(chosen)}</span>
          <button type="button" id="btnChangeSite">Change</button>
        </div>
      </div>`;
  }
  return `
    <div class="field site-search">
      <label>${f.label}</label>
      <input type="text" id="siteSearchInput" placeholder="Type to search all AFRRCS sites…" autocomplete="off">
      <div class="site-results" id="siteResults"></div>
    </div>`;
}

function renderGpsField(){
  const lat = fieldValue("Latitude");
  const lon = fieldValue("Longitude");
  const site = SITES.find(s=>s.name === current.data["Site Name"]);
  const fromRegister = site && site.lat !== undefined &&
    lat === site.lat.toFixed(6) && lon === site.lon.toFixed(6);
  return `
    <div class="field">
      <label>Coordinates</label>
      <div class="gps-row">
        <input type="text" inputmode="decimal" data-key="Latitude" placeholder="Latitude" value="${escapeHtml(lat)}">
        <input type="text" inputmode="decimal" data-key="Longitude" placeholder="Longitude" value="${escapeHtml(lon)}">
      </div>
      <div class="gps-row">
        <button type="button" class="gps-btn" id="btnGps" style="flex:1">Use My Location</button>
      </div>
      ${fromRegister ? '<div class="hint">From the site register. Tap "Use My Location" if this visit shows it\'s moved.</div>' : ""}
      <div class="gps-status" id="gpsStatus"></div>
    </div>`;
}

function renderReview(){
  let html = "";
  for(const step of STEPS){
    if(step.title === "Review & Finish") continue;
    if(step.fields.length === 0) continue;
    html += `<div class="review-group"><h3>${step.title}</h3>`;
    for(const f of step.fields){
      const v = current.data[f.key];
      if(v === undefined || v === "") continue;
      html += `<div class="review-row"><span class="k">${f.label}</span><span class="v">${escapeHtml(v)}</span></div>`;
    }
    html += `</div>`;
  }
  html += `<div class="field"><div class="hint">Tapping "Save & Send File" saves a file on this device with everything above. Send that file to the office (email, Teams, etc.) to add this visit to the master spreadsheet. Take photos separately with your regular camera and add them to the spreadsheet afterward.</div></div>`;
  return html;
}

function wireFieldEvents(step){
  main.querySelectorAll("input[data-key], textarea[data-key]").forEach(el=>{
    el.addEventListener("input", ()=> setFieldValue(el.dataset.key, el.value));
  });

  main.querySelectorAll(".choice-group").forEach(group=>{
    const key = group.dataset.key;
    group.querySelectorAll(".choice-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        setFieldValue(key, btn.dataset.val);
        group.querySelectorAll(".choice-btn").forEach(b=>b.classList.remove("sel","yes","no"));
        btn.classList.add("sel");
        if(btn.dataset.val==="Yes") btn.classList.add("yes");
        if(btn.dataset.val==="No") btn.classList.add("no");
      });
    });
  });

  // Site search
  const siteInput = document.getElementById("siteSearchInput");
  if(siteInput){
    const resultsEl = document.getElementById("siteResults");
    const showResults = (q)=>{
      const query = q.trim().toLowerCase();
      const matches = query.length===0 ? [] :
        SITES.filter(s=>s.name.toLowerCase().includes(query)).slice(0,25);
      resultsEl.innerHTML = matches.map(s=>
        `<div class="site-result" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>`
      ).join("");
      resultsEl.querySelectorAll(".site-result").forEach(r=>{
        r.addEventListener("click", ()=>{
          setFieldValue("Site Name", r.dataset.name);
          applySiteDefaults(r.dataset.name);
          renderStep();
        });
      });
    };
    siteInput.addEventListener("input", ()=> showResults(siteInput.value));
    siteInput.focus();
  }
  const changeSiteBtn = document.getElementById("btnChangeSite");
  if(changeSiteBtn){
    changeSiteBtn.addEventListener("click", ()=>{
      setFieldValue("Site Name", "");
      renderStep();
    });
  }

  // GPS
  const gpsBtn = document.getElementById("btnGps");
  if(gpsBtn){
    gpsBtn.addEventListener("click", captureGps);
  }
}

/* ---- GPS capture (two-stage fallback) ---- */
function captureGps(){
  const statusEl = document.getElementById("gpsStatus");
  if(!("geolocation" in navigator)){
    statusEl.textContent = "Location isn't available in this browser.";
    return;
  }
  statusEl.textContent = "Finding your location (high accuracy)…";
  const applyPosition = (pos)=>{
    const lat = pos.coords.latitude.toFixed(6);
    const lon = pos.coords.longitude.toFixed(6);
    setFieldValue("Latitude", lat);
    setFieldValue("Longitude", lon);
    document.querySelector('input[data-key="Latitude"]').value = lat;
    document.querySelector('input[data-key="Longitude"]').value = lon;
    statusEl.textContent = `Location set (±${Math.round(pos.coords.accuracy)}m).`;
  };
  navigator.geolocation.getCurrentPosition(
    applyPosition,
    ()=>{
      statusEl.textContent = "Retrying with a lower-accuracy fix…";
      navigator.geolocation.getCurrentPosition(
        applyPosition,
        (err)=>{
          statusEl.textContent = "Couldn't get your location automatically — type the coordinates in manually. " +
            "(If this file was opened directly instead of from a saved home-screen shortcut, some browsers block location for security reasons.)";
        },
        { enableHighAccuracy:false, timeout:20000, maximumAge:60000 }
      );
    },
    { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
  );
}

function base64ToUint8Array(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function buildReportBlob(data){
  const tagData = {};

    tagData[tag] = (v === undefined || v === null) ? "" : String(v);
  }

  tagData.EstimatedCost = (cost === undefined || cost === null || cost === "") ? "" : `$${cost}`;
  tagData.ReviewedBy = "";
  tagData.ApprovalDate = "";
  tagData.GeneratedDate = todayISO();

  const zip = new PizZip(base64ToUint8Array(REPORT_TEMPLATE_B64));
  const docx = new Docxtemplater(zip, {paragraphLoop:true, linebreaks:true, nullGetter:()=>""});
  docx.render(tagData);
  const out = docx.getZip().generate({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  return out;
}

/* ---- Finish: prepare both files, then let the person choose how to send them ---- */
var pendingBlob = null;
var pendingFilename = null;
var pendingReportBlob = null;
var pendingReportFilename = null;

async function finishAssessment(){
  const record = Object.assign({}, current.data);

  const site = (current.data["Site Name"] || "Site").replace(/[^a-z0-9]+/gi,"_");
  const date = current.data["Assessment Date"] || todayISO();
  pendingFilename = `${site}_SiteSecurityAssessment_${date}.afrrcs`;
  pendingBlob = new Blob([JSON.stringify(record)], {type:"application/json"});

  pendingReportFilename = `${site}_SiteSecurityAssessment_${date}_Report.docx`;
  try{
    pendingReportBlob = buildReportBlob(current.data);
  }catch(err){
    pendingReportBlob = null; // report is a bonus -- never block finishing on it
  }

  current.status = "completed";
  current.updatedAt = Date.now();
  await dbPut(current);

  renderDone();
}

function canShareFiles(files){
  if(!navigator.share || !navigator.canShare) return false;
  try{
    return navigator.canShare({files});
  }catch(err){
    return false;
  }
}

async function shareFiles(files, label){
  try{
    await navigator.share({
      files,
      title:"AFRRCS Site Assessment",
      text:`Assessment for ${current && current.data["Site Name"] || "site"}`,
    });
    toast("Sent.");
  }catch(err){
    if(err && err.name !== "AbortError"){
      toast("Couldn't open the share sheet -- try Save to Device instead.");
    }
  }
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function saveFilesToDevice(){
  downloadBlob(pendingBlob, pendingFilename);
  if(pendingReportBlob){
    setTimeout(()=>downloadBlob(pendingReportBlob, pendingReportFilename), 400);
  }
  toast("Saved to this device.");
}

function renderDone(){
  topTitle.textContent = "Saved";
  btnBack.classList.add("hidden");
  progressWrap.classList.add("hidden");
  navbar.classList.add("hidden");

  const dataFile = new File([pendingBlob], pendingFilename, {type:"application/json"});
  const reportFile = pendingReportBlob
    ? new File([pendingReportBlob], pendingReportFilename,
        {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})
    : null;

  const canShareBoth = reportFile && canShareFiles([dataFile, reportFile]);
  const canShareDataOnly = !canShareBoth && canShareFiles([dataFile]);

  const reportNote = pendingReportBlob
    ? `Includes a Word report (<strong>${escapeHtml(pendingReportFilename)}</strong>) with space to add photos afterward.`
    : `A Word report could not be generated this time -- the data file is still complete and safe to send.`;

  let shareButton = "", hint = "", partialNote = "";
  if(canShareBoth){
    shareButton = `<button class="btn btn-primary" id="btnShare">Send via Email / Teams / etc.</button>`;
    hint = `Sending goes straight to Mail, Teams, Messages, or whatever you pick &mdash; both files attach together, no need to hunt for them in Files afterward.`;
  } else if(canShareDataOnly){
    shareButton = `<button class="btn btn-primary" id="btnShare">Send Data File via Email / Teams / etc.</button>`;
    hint = `This sends the data file straight through Mail, Teams, etc. This browser can't share two files at once, so use Save to Device below to also grab the Word report and attach it separately.`;
  } else {
    hint = `This browser doesn't support direct sharing, so save the file(s), then attach them manually in an email or Teams message.`;
  }
  const saveButton = `<button class="btn ${shareButton ? "btn-secondary" : "btn-primary"}" id="btnSaveDevice">Save to Device</button>`;

  main.innerHTML = `
    <div class="done-wrap">
      <div class="check">&#10003;</div>
      <h2>Assessment ready</h2>
      <p><strong>${escapeHtml(pendingFilename)}</strong><br>${reportNote}<br>${hint}</p>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:280px;margin:0 auto 18px;">
        ${shareButton}
        ${saveButton}
      </div>
      <button class="btn btn-ghost" id="btnHome">Done</button>
    </div>`;

  if(canShareBoth){
    document.getElementById("btnShare").onclick = ()=>shareFiles([dataFile, reportFile]);
  } else if(canShareDataOnly){
    document.getElementById("btnShare").onclick = ()=>shareFiles([dataFile]);
  }
  document.getElementById("btnSaveDevice").onclick = saveFilesToDevice;
  document.getElementById("btnHome").onclick = ()=>{
    current=null; pendingBlob=null; pendingFilename=null;
    pendingReportBlob=null; pendingReportFilename=null;
    renderHome();
  };
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ============================================================
   Boot
   ============================================================ */
openDB().then(renderHome).catch(err=>{
  // Last-resort safety net: even if something unexpected still goes wrong,
  // show an error instead of leaving the screen blank under the header.
  main.innerHTML = `<div class="empty-note">Something went wrong starting the app. Try closing and reopening it.<br><br>` +
    `(Technical detail: ${escapeHtml(String(err && err.message || err))})</div>`;
});
</script>
